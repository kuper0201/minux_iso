on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

name: Build ISO

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: archlinux
      options: --privileged
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        # Keep the rolling-release container in sync to avoid partial upgrades.
        run: pacman -Syu --noconfirm --needed archiso
      - name: Build ISO
        shell: bash
        run: mkarchiso -v .
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: minux
          path: out/*.iso
